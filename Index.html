<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishal's AI Agents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1100px;
            width: 100%;
        }

        .card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 28px;
            transition: all 0.25s ease;
            text-align: center;
        }

        .card:hover {
            border-color: #00ff88;
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .card p {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 22px;
        }

        .card a {
            text-decoration: none;
        }

        .card button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card button:hover {
            background: #00cc6a;
        }
    </style>
</head>
<body>
    <h1>Rishal's AI Agents</h1>
    <p class="subtitle">Select an AI to open</p>

    <div class="grid">

        <div class="card">
            <h2>Kronos AI</h2>
            <p>For Sid</p>
            <a href="https://kronos-ai-r-for-sid.puter.site" target="_blank">
                <button>Open Kronos</button>
            </a>
        </div>

        <div class="card">
            <h2>Krypted AI</h2>
            <p>For Ved</p>
            <a href="https://krypted-ai-forved.puter.site/" target="_blank">
                <button>Open Krypted</button>
            </a>
        </div>

        <div class="card">
            <h2>Libra AI</h2>
            <p>Rishal</p>
            <a href="https://libra-ai-rishal.lovable.app/" target="_blank">
                <button>Open Libra</button>
            </a>
        </div>

        <div class="card">
            <h2>R AI</h2>
            <p>Rishal</p>
            <a href="https://rai-rishal.bolt.host/" target="_blank">
                <button>Open R AI</button>
            </a>
        </div>

        <div class="card">
            <h2>Isaac Football</h2>
            <p>Tips & Tricks</p>
            <a href="https://isaac-football-rishal-tips-tricks.base44.app/" target="_blank">
                <button>Open Football AI</button>
            </a>
        </div>

        <div class="card">
            <h2>R Search AI</h2>
            <p>Search Engine Style</p>
            <a href="https://rishal-r-searchai.puter.site/" target="_blank">
                <button>Open R Search</button>
            </a>
        </div>

    </div>
</body>
</html>
